name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Если lock-файла ещё нет — создаём его (дальше сборки идут через npm ci)
      - name: Generate package-lock.json if missing
        id: lock
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit package-lock.json
        if: steps.lock.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          git config user.name "r1d3erg"
          git config user.email "33750540+r1d3erg@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json for reproducible builds"
          git push

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q

      - name: Build portal image
        run: docker build -t ohrana-truda-portal:ci .

      - name: Build backend image
        run: docker build -t ohrana-truda-backend:ci ./backend
