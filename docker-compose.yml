services:
  portal:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    container_name: ohrana-truda-portal

  backend:
    build: ./backend
    # Наружу не публикуется: портал ходит в API через nginx (/api → backend:8000)
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      READINESS_GOOD: ${READINESS_GOOD:-90}
      READINESS_WARN: ${READINESS_WARN:-70}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-120}
      API_DOCS: ${API_DOCS:-false}
      TRUST_PROXY: "true"   # бэкенд доступен только через nginx портала, X-Real-IP выставляет nginx
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    container_name: ohrana-truda-backend

  db:
    image: postgres:16-alpine
    # Учётные данные — из файла .env (см. .env.example), в репозитории не хранятся
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    container_name: ohrana-truda-db

volumes:
  pgdata:
