# Заголовки безопасности портала (подключается в nginx.conf в каждом location)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: только свои скрипты, стили, шрифты и запросы; без unsafe-inline / unsafe-eval.
# React задаёт style={...} через CSSOM — это CSP не блокирует.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS включайте, только когда портал открыт по HTTPS (на внешнем прокси или здесь):
# add_header Strict-Transport-Security "max-age=31536000" always;
