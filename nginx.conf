server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлы Vite с хэшем в имени — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API бэкенда. Имя backend резолвится при запросе (через DNS Docker),
    # поэтому nginx стартует, даже если бэкенд ещё не поднялся.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;   # чуть больше MAX_UPLOAD_MB бэкенда
        proxy_read_timeout 120s;
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }
}
