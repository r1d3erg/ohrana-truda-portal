server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Заголовки безопасности — в отдельном файле и подключаются в КАЖДОМ location:
    # nginx не наследует add_header с уровня server, если в location есть свой add_header.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлы Vite с хэшем в имени — кэшируем надолго
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API бэкенда. Имя backend резолвится при запросе (через DNS Docker),
    # поэтому nginx стартует, даже если бэкенд ещё не поднялся.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;   # чуть больше MAX_UPLOAD_MB бэкенда
        proxy_read_timeout 120s;
    }

    # SPA-фолбэк
    # Служебные и чужие пути не отдаём (сканеры ищут .env, .git, wp-*)
    location ~ /\.(?!well-known) { return 404; }
    location ~* ^/(wp-|xmlrpc\.php|phpmyadmin) { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
